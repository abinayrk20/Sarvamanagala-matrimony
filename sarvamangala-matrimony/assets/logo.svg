<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 500 500" width="100%" height="100%">
  <defs>
    <!-- Radial and Linear Gradients -->
    <radialGradient id="bgGrad" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#7B1424" />
      <stop offset="70%" stop-color="#550D18" />
      <stop offset="100%" stop-color="#3A0810" />
    </radialGradient>
    
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FCE082" />
      <stop offset="25%" stop-color="#DFB758" />
      <stop offset="50%" stop-color="#C29432" />
      <stop offset="75%" stop-color="#E9C86A" />
      <stop offset="100%" stop-color="#996F1C" />
    </linearGradient>

    <linearGradient id="innerGold" x1="0%" y1="100%" x2="100%" y2="0%">
      <stop offset="0%" stop-color="#FFEAA7" />
      <stop offset="50%" stop-color="#DFB758" />
      <stop offset="100%" stop-color="#B28224" />
    </linearGradient>

    <filter id="goldGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feGaussianBlur stdDeviation="3" result="blur" />
      <feComposite in="SourceGraphic" in2="blur" operator="over" />
    </filter>

    <!-- Circular paths for text -->
    <path id="textArcTop" d="M 70,250 A 180,180 0 1,1 430,250" fill="none" />
    <path id="textArcBottom" d="M 420,250 A 170,170 0 0,1 80,250" fill="none" />
  </defs>

  <!-- Outer Decorative Ring -->
  <circle cx="250" cy="250" r="242" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="5" />
  
  <!-- Outer Beaded Pattern (Kolam / Temple Garland effect) -->
  <circle cx="250" cy="250" r="234" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-dasharray="4,6" opacity="0.85" />
  <circle cx="250" cy="250" r="226" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" />

  <!-- Maroon Text Track -->
  <circle cx="250" cy="250" r="182" fill="#480A13" stroke="url(#goldGrad)" stroke-width="2.5" />

  <!-- Outer Text: SARVAMANGALA MATRIMONY -->
  <text font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="29.5" font-weight="700" letter-spacing="4.5" fill="url(#goldGrad)" filter="url(#goldGlow)">
    <textPath href="#textArcTop" startOffset="50%" text-anchor="middle">
      SARVAMANGALA MATRIMONY
    </textPath>
  </text>

  <!-- Bottom Text: KANCHIPURAM -->
  <text font-family="'Cinzel', 'Playfair Display', 'Georgia', serif" font-size="22" font-weight="700" letter-spacing="6.5" fill="url(#goldGrad)">
    <textPath href="#textArcBottom" startOffset="50%" text-anchor="middle">
      ✦ KANCHIPURAM ✦
    </textPath>
  </text>

  <!-- Decorative Separator Stars at Left & Right -->
  <g transform="translate(68, 250)" fill="url(#goldGrad)">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" />
  </g>
  <g transform="translate(432, 250)" fill="url(#goldGrad)">
    <polygon points="0,-7 2,-2 7,0 2,2 0,7 -2,2 -7,0 -2,-2" />
  </g>

  <!-- Inner Sacred Medallion Border -->
  <circle cx="250" cy="250" r="140" fill="url(#bgGrad)" stroke="url(#goldGrad)" stroke-width="3" />
  <circle cx="250" cy="250" r="134" fill="none" stroke="url(#goldGrad)" stroke-width="1.5" stroke-dasharray="3,4" />

  <!-- Central Auspicious Motifs: Sacred Kalasam, Deepam Flame & Mangalsutra (Thali) -->
  <g transform="translate(250, 245)">
    <!-- Aura Rays Behind Kalasam -->
    <circle cx="0" cy="0" r="75" fill="none" stroke="url(#goldGrad)" stroke-width="0.8" opacity="0.3" stroke-dasharray="2,5" />
    
    <!-- Sacred Kalasam (Pot) -->
    <!-- Base -->
    <path d="M -22,46 L 22,46 L 16,52 L -16,52 Z" fill="url(#goldGrad)" />
    
    <!-- Pot Body -->
    <path d="M -20,46 C -40,30 -42,5 -24,-10 C -18,-15 -14,-16 -12,-18 L 12,-18 C 14,-16 18,-15 24,-10 C 42,5 40,30 20,46 Z" fill="url(#innerGold)" stroke="#680D1A" stroke-width="1" />
    
    <!-- Engraved Kolam bands on Kalasam Pot -->
    <path d="M -26,14 Q 0,22 26,14" fill="none" stroke="#680D1A" stroke-width="1.8" />
    <path d="M -28,26 Q 0,34 28,26" fill="none" stroke="#680D1A" stroke-width="1.5" />
    <circle cx="0" cy="20" r="3.5" fill="#7B1424" stroke="url(#goldGrad)" stroke-width="1" />

    <!-- Kalasam Neck & Rim -->
    <rect x="-16" y="-22" width="32" height="6" rx="2" fill="url(#goldGrad)" stroke="#550D18" stroke-width="0.8" />
    <ellipse cx="0" cy="-22" rx="18" ry="4" fill="url(#goldGrad)" />

    <!-- Mango Leaves (Maavilai) Peeking from Neck -->
    <path d="M -16,-24 C -36,-38 -32,-56 -24,-64 C -20,-48 -10,-32 -4,-25 Z" fill="url(#goldGrad)" />
    <path d="M 16,-24 C 36,-38 32,-56 24,-64 C 20,-48 10,-32 4,-25 Z" fill="url(#goldGrad)" />
    <path d="M -10,-25 C -18,-45 -12,-68 0,-76 C 12,-68 18,-45 10,-25 Z" fill="url(#goldGrad)" />

    <!-- Coconut (Thengai) -->
    <path d="M -14,-26 C -20,-42 0,-62 0,-62 C 0,-62 20,-42 14,-26 Z" fill="#58101A" stroke="url(#goldGrad)" stroke-width="1.5" />

    <!-- Divine Agal Vilakku / Deepam Flame at Top of Kalasam -->
    <g transform="translate(0, -66)">
      <!-- Outer Flame Glow -->
      <path d="M 0,-24 C -10,-12 -12,2 0,10 C 12,2 10,-12 0,-24 Z" fill="url(#goldGrad)" opacity="0.9" filter="url(#goldGlow)" />
      <!-- Inner Flame Core -->
      <path d="M 0,-18 C -5,-8 -6,0 0,6 C 6,0 5,-8 0,-18 Z" fill="#FFF7D6" />
    </g>

    <!-- Mangalsutra / Sacred Thali & Kasu Coins Garland Hanging from Neck -->
    <path d="M -24,-12 C -42,12 -38,58 -2,70 C 34,58 38,12 24,-12" fill="none" stroke="url(#goldGrad)" stroke-width="2" stroke-linecap="round" stroke-dasharray="3,1" />
    
    <!-- Central Thali Motif (Auspicious South Indian Thali) -->
    <g transform="translate(0, 72)">
      <path d="M -10,0 L 10,0 L 7,12 L 0,18 L -7,12 Z" fill="url(#goldGrad)" stroke="#58101A" stroke-width="1" />
      <circle cx="0" cy="6" r="2.5" fill="#7B1424" />
      <circle cx="0" cy="22" r="2.5" fill="url(#goldGrad)" />
    </g>
    <!-- Left & Right Gold Kasu coins -->
    <circle cx="-16" cy="62" r="4.5" fill="url(#goldGrad)" stroke="#58101A" stroke-width="0.8" />
    <circle cx="16" cy="62" r="4.5" fill="url(#goldGrad)" stroke="#58101A" stroke-width="0.8" />

    <!-- Lotus Petal Platform Base -->
    <g transform="translate(0, 54)">
      <path d="M -45,0 C -30,-8 -15,-6 0,2 C 15,-6 30,-8 45,0 C 35,14 15,18 0,16 C -15,18 -35,14 -45,0 Z" fill="url(#goldGrad)" opacity="0.95" />
      <path d="M -26,-2 C -18,-8 -8,-6 0,0 C 8,-6 18,-8 26,-2 C 20,8 10,10 0,9 C -10,10 -20,8 -26,-2 Z" fill="#6B111E" />
    </g>
  </g>

  <!-- Auspicious Tamil Wordmark Subtext in Inner Circle: மங்கல வாழ்வு தரும் மணப்பந்தல் -->
  <text x="250" y="348" text-anchor="middle" font-family="'Mukta Malar', 'Noto Sans Tamil', sans-serif" font-size="13" font-weight="700" fill="url(#goldGrad)" letter-spacing="2">
    மங்கல வாழ்வு தரும் மணப்பந்தல்
  </text>
</svg>
